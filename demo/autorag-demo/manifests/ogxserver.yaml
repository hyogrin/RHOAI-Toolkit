---
# OGX config.yaml ConfigMap
# Must have ogx.io/watch: "true" label for operator detection
# All ${env.XXX} references are resolved at runtime from container env vars
apiVersion: v1
kind: ConfigMap
metadata:
  name: autorag-ogx-config
  namespace: ${NAMESPACE}
  labels:
    ogx.io/watch: "true"
    opendatahub.io/dashboard: "true"
data:
  config.yaml: |
    version: '2'
    distro_name: rh
    apis:
    - responses
    - file_processors
    - files
    - inference
    - tool_runtime
    - vector_io
    providers:
      inference:
      - provider_id: sentence-transformers
        provider_type: inline::sentence-transformers
        config:
          trust_remote_code: false
      - provider_id: vllm-llm
        provider_type: remote::vllm
        config:
          api_token: ${env.VLLM_API_TOKEN:=fake}
          base_url: ${env.VLLM_URL}
          max_tokens: ${env.VLLM_MAX_TOKENS:=4096}
          tls_verify: ${env.VLLM_TLS_VERIFY:=false}
      - provider_id: vllm-embedding
        provider_type: remote::vllm
        config:
          api_token: ${env.VLLM_EMBEDDING_API_TOKEN:=fake}
          base_url: ${env.VLLM_EMBEDDING_URL}
          tls_verify: ${env.VLLM_EMBEDDING_TLS_VERIFY:=false}
      vector_io:
      - provider_id: milvus
        provider_type: remote::milvus
        config:
          uri: ${env.MILVUS_URI}
          token: ${env.MILVUS_TOKEN:=}
          consistency_level: Bounded
          persistence:
            backend: kv_default
            namespace: vector_io::milvus
      responses:
      - provider_id: builtin
        provider_type: inline::builtin
        config:
          persistence:
            responses:
              backend: sql_default
              max_write_queue_size: 10000
              num_writers: 4
              table_name: responses
      file_processors:
      - provider_id: pypdf
        provider_type: inline::pypdf
        config: {}
      files:
      - provider_id: localfs-files
        provider_type: inline::localfs
        config:
          metadata_store:
            backend: sql_default
            table_name: files_metadata
          storage_dir: /opt/app-root/src/.llama/distributions/rh/files
      tool_runtime:
      - provider_id: file-search
        provider_type: inline::file-search
        config: {}
      - provider_id: model-context-protocol
        provider_type: remote::model-context-protocol
        config: {}
    metadata_store:
      type: postgres
      host: ${env.POSTGRES_HOST}
      port: ${env.POSTGRES_PORT:=5432}
      db: ${env.POSTGRES_DB:=ogx}
      user: ${env.POSTGRES_USER:=ogx}
      password: ${env.POSTGRES_PASSWORD}
    storage:
      backends:
        kv_default:
          db_path: /opt/app-root/src/.llama/distributions/rh/kvstore.db
          type: kv_sqlite
        sql_default:
          type: sql_postgres
          host: ${env.POSTGRES_HOST}
          port: ${env.POSTGRES_PORT:=5432}
          db: ${env.POSTGRES_DB:=ogx}
          user: ${env.POSTGRES_USER:=ogx}
          password: ${env.POSTGRES_PASSWORD}
      stores:
        connectors:
          backend: sql_default
          table_name: connectors
        conversations:
          backend: sql_default
          table_name: openai_conversations
        inference:
          backend: sql_default
          max_write_queue_size: 10000
          num_writers: 4
          table_name: inference_store
        metadata:
          backend: kv_default
          namespace: registry
        prompts:
          backend: sql_default
          table_name: prompts
    vector_stores:
      default_provider_id: milvus
      default_embedding_model:
        provider_id: vllm-embedding
        model_id: ${EMBEDDING_MODEL}
      annotation_prompt_params:
        enable_annotations: true
      file_ingestion_params:
        default_chunk_overlap_tokens: 128
        default_chunk_size_tokens: 512
      chunk_retrieval_params:
        chunk_multiplier: 5
        default_reranker_strategy: rrf
        default_search_mode: vector
        max_tokens_in_context: 4000
        rrf_impact_factor: 60
        weighted_search_alpha: 0.5
      file_batch_params:
        cleanup_interval_seconds: 86400
        file_batch_chunk_size: 10
        max_concurrent_files_per_batch: 3
    registered_resources:
      models:
      - provider_id: vllm-llm
        model_id: ${INFERENCE_MODEL}
        model_type: llm
        metadata:
          display_name: ${INFERENCE_MODEL}
      - provider_id: vllm-embedding
        model_id: ${EMBEDDING_MODEL}
        model_type: embedding
        metadata:
          embedding_dimension: 768
      vector_stores: []
    external_providers_dir: /opt/app-root/.llama/providers.d
    server:
      port: 8321
---
# OGXServer CR - RHOAI 3.5 (replaces LlamaStackDistribution)
# Uses overrideConfig approach (declarative mode fails with registry.redhat.io HTTP 401)
apiVersion: ogx.io/v1beta1
kind: OGXServer
metadata:
  name: autorag-ogx
  namespace: ${NAMESPACE}
  annotations:
    openshift.io/display-name: AutoRAG OGX Server
  labels:
    opendatahub.io/dashboard: "true"
spec:
  distribution:
    name: rh
  network:
    port: 8321
    externalAccess:
      enabled: true
  overrideConfig:
    key: config.yaml
    name: autorag-ogx-config
  workload:
    overrides:
      replicas: 1
      resources:
        requests:
          cpu: "250m"
          memory: "500Mi"
        limits:
          cpu: "2"
          memory: "12Gi"
      env:
        - name: VLLM_TLS_VERIFY
          value: "false"
        - name: VLLM_URL
          value: "${VLLM_URL}"
        - name: VLLM_API_TOKEN
          value: "${VLLM_API_TOKEN}"
        - name: VLLM_MAX_TOKENS
          value: "4096"
        - name: VLLM_EMBEDDING_URL
          value: "${VLLM_EMBEDDING_URL}"
        - name: VLLM_EMBEDDING_API_TOKEN
          value: "${VLLM_EMBEDDING_API_TOKEN}"
        - name: VLLM_EMBEDDING_TLS_VERIFY
          value: "false"
        - name: MILVUS_URI
          value: "${MILVUS_URI}"
        - name: MILVUS_TOKEN
          value: ""
        - name: POSTGRES_HOST
          value: "ogx-postgres.${NAMESPACE}.svc.cluster.local"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          value: "ogx"
        - name: POSTGRES_USER
          value: "ogx"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ogx-postgres-secret
              key: password
        - name: OGX_CONFIG_DIR
          value: "/opt/app-root/src/.ogx/distributions/rh/"
